[pytest]
minversion = 8.2
testpaths = tests
addopts =
    --strict-markers
    --junitxml=test-results/junit.xml
    --cov=handwave
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=xml:test-results/coverage.xml
    --cov-report=html:test-results/coverage-html
    --cov-fail-under=80
markers =
    unit: isolated component behavior with mocked external boundaries
    integration: collaboration between multiple application components
    ui: PyQt widget, signal, and user-interaction behavior
    benchmark: deterministic performance regression benchmark
